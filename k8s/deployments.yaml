apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-api
  labels:
    app: whisper-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: whisper-api
  template:
    metadata:
      labels:
        app: whisper-api
    spec:
      containers:
      - name: api
        image: your-registry/faster-whisper-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4001
        env:
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        - name: API_SECRET
          valueFrom:
            secretKeyRef:
              name: whisper-secrets
              key: API_SECRET
        - name: WORKERS
          value: "4"
        - name: RATE_LIMIT_PER_MINUTE
          value: "120"
        - name: MAX_QUEUE_DEPTH
          value: "1000"
        - name: S3_BUCKET
          value: "your-audio-bucket"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: whisper-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: whisper-secrets
              key: AWS_SECRET_ACCESS_KEY
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 4001
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 4001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: whisper-api
spec:
  type: ClusterIP
  selector:
    app: whisper-api
  ports:
  - port: 4001
    targetPort: 4001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-worker
  labels:
    app: whisper-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whisper-worker
  template:
    metadata:
      labels:
        app: whisper-worker
    spec:
      containers:
      - name: worker
        image: your-registry/faster-whisper-api:latest
        command: ["celery", "-A", "worker.celery_app", "worker", "--loglevel=info", "--concurrency=1", "--prefetch-multiplier=1", "-Q", "celery"]
        env:
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        - name: MODEL_SIZE
          value: "base"
        - name: DEVICE
          value: "cpu"
        - name: COMPUTE_TYPE
          value: "int8"
        - name: CPU_THREADS
          value: "4"
        - name: S3_BUCKET
          value: "your-audio-bucket"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: whisper-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: whisper-secrets
              key: AWS_SECRET_ACCESS_KEY
        resources:
          requests:
            cpu: "2000m"
            memory: "2Gi"
          limits:
            cpu: "4000m"
            memory: "4Gi"
