version: '3.8'

services:
  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 2gb
      --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: always
    ports:
      - "4001:4001"
    volumes:
      - app_data:/app/data
    environment:
      - REDIS_URL=redis://redis:6379/0
      - UPLOAD_DIR=/app/data
      - API_SECRET=${API_SECRET}
      - WORKERS=4
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-120}
      - MAX_QUEUE_DEPTH=${MAX_QUEUE_DEPTH:-1000}
      # Optional Cloudflare R2 / S3 storage
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: always
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=1 --prefetch-multiplier=1 -Q celery
    volumes:
      - app_data:/app/data
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MODEL_SIZE=base
      - DEVICE=cpu
      - COMPUTE_TYPE=int8
      - CPU_THREADS=4
      # Optional Cloudflare R2 / S3 storage
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    depends_on:
      redis:
        condition: service_healthy

  worker-2:
    build: .
    restart: always
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=1 --prefetch-multiplier=1 -Q celery
    volumes:
      - app_data:/app/data
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MODEL_SIZE=base
      - DEVICE=cpu
      - COMPUTE_TYPE=int8
      - CPU_THREADS=4
      # Optional Cloudflare R2 / S3 storage
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    depends_on:
      redis:
        condition: service_healthy

  flower:
    image: mher/flower:latest
    restart: always
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_PORT=5555
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  app_data:
